<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boat Journal</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boat Journal">
<meta name="theme-color" content="#06243f">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#0b2540;--mute:#6b7c8d;--line:#e1e8ee;--acc:#0a7f9c;--acc2:#12b5b0;--on:#fff;--red:#e0483b;--amb:#d98a00;--ok:#1f9d6b;--shadow:0 4px 18px rgba(11,37,64,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#07131e;--card:#0f2233;--ink:#e8f1f7;--mute:#8fa4b5;--line:#1d3548;--acc:#3cc4d6;--acc2:#2fd0b0;--on:#03202a;--red:#ff7b6e;--amb:#f2b84b;--ok:#5fd6a0;--shadow:0 4px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#07131e;--card:#0f2233;--ink:#e8f1f7;--mute:#8fa4b5;--line:#1d3548;--acc:#3cc4d6;--acc2:#2fd0b0;--on:#03202a;--red:#ff7b6e;--amb:#f2b84b;--ok:#5fd6a0;--shadow:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.hero{background:linear-gradient(150deg,#06243f 0%,#0a5a77 62%,#12a3a8 130%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 56px;border-radius:0 0 28px 28px}
.brand{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;padding:11px;border-radius:15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.sub{margin:3px 0 0;opacity:.8;font-size:.85rem}
main{max-width:760px;margin:-34px auto 0;padding:0 16px 120px}
h2{font-size:1.1rem;font-weight:800;margin:4px 2px 12px;letter-spacing:-.01em}
.sum{display:flex;gap:10px;margin:0 0 20px}
.sum div{flex:1;background:var(--card);border-radius:16px;padding:12px;font-size:.74rem;font-weight:600;color:var(--mute);box-shadow:var(--shadow);border-top:4px solid var(--acc)}
.sum .r{border-top-color:var(--red)}.sum .a{border-top-color:var(--amb)}.sum .o{border-top-color:var(--ok)}
.sum b{display:block;font-size:1.65rem;font-weight:800;line-height:1.1;color:var(--ink)}
.sum .r b{color:var(--red)}.sum .a b{color:var(--amb)}.sum .o b{color:var(--ok)}
.sum [data-sf],.sum [data-sn]{cursor:pointer}
.sum [aria-pressed="true"]{outline:2px solid var(--acc);outline-offset:1px}
#flt{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
#flt:empty{display:none}
#flt button{flex:none;padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-weight:600;font-size:.85rem;cursor:pointer}
#flt button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
form{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin:0 0 16px}
form input,form select{flex:1 1 150px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
form button{flex:1 1 100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);font:inherit;font-weight:700;cursor:pointer}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:inset 5px 0 0 var(--ok),var(--shadow)}
li.red{box-shadow:inset 5px 0 0 var(--red),var(--shadow)}
li.amb{box-shadow:inset 5px 0 0 var(--amb),var(--shadow)}
li.done{opacity:.6}li.done .t{text-decoration:line-through}
li.empty{box-shadow:none;background:transparent;border:1px dashed var(--line);justify-content:center;color:var(--mute);text-align:center}
.t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere;cursor:pointer}
.t small{display:block;font-weight:500;color:var(--mute);font-size:.8rem;margin-top:2px}
.st{font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--line);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.red .st{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.amb .st{background:color-mix(in srgb,var(--amb) 16%,transparent);color:var(--amb)}
label.st{background:none;padding:0;color:var(--mute);font-weight:600}
li button{border:0;background:none;color:var(--mute);font-size:1.1rem;cursor:pointer;padding:4px 8px;font-family:inherit}
li button.rn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);font-size:.82rem;font-weight:700;border-radius:999px;padding:7px 14px}
li input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc);flex:none}
li input:not([type=checkbox]),li select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.st input{max-width:150px}
.foot{display:flex;gap:8px;margin-top:22px}
.foot button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;font:inherit;font-weight:600;font-size:.85rem;cursor:pointer}
#menu{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#menu button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mute);font:inherit;font-size:.68rem;font-weight:700;padding:7px 2px;border-radius:12px;cursor:pointer}
#menu svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#menu button[aria-pressed="true"]{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header class="hero"><div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M8 11h8M5 14c0 4 3 7 7 7s7-3 7-7"/></svg><div><h1>Boat Journal</h1><p class="sub">Scadenze, dotazioni e manutenzione</p></div></div></header>
<main>
<div id="sum" class="sum"></div>
<h2 id="stitle"></h2>
<nav id="flt"></nav>
<form id="f"></form>
<ul id="list"></ul>
<div class="foot">
<button id="exp">Esporta backup</button>
<button type="button" id="impb">Importa backup</button><input id="imp" type="file" accept=".json" hidden>
</div>
</main>
<nav id="menu"></nav>
<script>
const SEC={
 doc:{label:'Scadenze Documenti',scad:1,ph:'Es. Assicurazione',sug:['Assicurazione RC','Licenza di navigazione','Certificato di sicurezza','Patente nautica','Bollo / tassa di stazionamento','Contratto di ormeggio','Certificato d’uso motore']},
 dot:{label:'Scadenze dotazioni di Bordo',scad:1,ph:'Es. Razzi di segnalamento',sug:['Razzi di segnalamento','Estintori','Zattera di salvataggio','Giubbotti di salvataggio','EPIRB','Cassetta di pronto soccorso','Boetta / salvagente anulare']},
 lav:{label:'Lavori da fare',ph:'Es. Cambio olio e filtri'},
 sto:{label:'Storico lavori',sto:1}
};
const CATS={ele:'Elettrico',sca:'Scafo',mot:'Motore'};
const SH={doc:'Documenti',dot:'Dotazioni',lav:'Da fare',sto:'Storico'};
const ICO={doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',dot:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/>',lav:'<path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.5 2.5-2.4-.6-.6-2.4z"/>',sto:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
let S={sec:'doc',f:'all',data:{}};
const KEY='barca-v1';
try{const r=localStorage.getItem(KEY);if(r)S.data=JSON.parse(r)||{}}catch(e){}
if(!S.data.lav){S.data.lav=[];for(const c in CATS)(S.data[c]||[]).forEach(i=>S.data.lav.push({...i,c}))}
const K=()=>S.sec==='sto'?'lav':S.sec;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S.data))}catch(e){}};
const $=id=>document.getElementById(id);
const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function editRow(it,i){
 const sc=!!SEC[S.sec].scad,sto=S.sec==='sto',lb=(t,x)=>`<label style="color:var(--mute);font-size:.85rem">${t} ${x}</label>`;
 let h=`<li class="ok" style="flex-wrap:wrap"><input name="n" value="${esc(it.n)}" aria-label="Nome" style="flex:1 1 100%">`;
 h+=lb(sc?'Scadenza':'Prevista',`<input name="date" type="date" value="${it.date||''}">`);
 if(!sc){h+=`<select name="c" aria-label="Categoria">${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${it.c===k?' selected':''}>${v}</option>`).join('')}</select>`;
  h+=sto?lb('Eseguito il',`<input name="doneDate" type="date" value="${it.doneDate||''}">`):`<select name="p" aria-label="Priorità"><option value="0"${it.p?'':' selected'}>Normale</option><option value="1"${it.p?' selected':''}>Urgente</option></select>`}
 return h+`<button class="rn" data-es="${i}">Salva</button><button data-ec="1" style="font-size:.9rem">Annulla</button></li>`}
function render(){
 const sec=SEC[S.sec],isScad=!!sec.scad,isSto=!!sec.sto,key=K(),items=(S.data[key]=S.data[key]||[]);
 $('menu').innerHTML=Object.entries(SEC).map(([k,v])=>`<button data-s="${k}" aria-pressed="${k===S.sec}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg><span>${SH[k]}</span></button>`).join('');$('stitle').textContent=sec.label;
 $('flt').innerHTML=isScad?'':[['all','Tutti'],...Object.entries(CATS)].map(([k,v])=>`<button data-f="${k}" aria-pressed="${k===S.f}">${v}</button>`).join('');
 let sum='';
 if(isScad){const c={red:0,amb:0,ok:0};items.forEach(i=>{const d=days(i.date);c[d<0?'red':d<=30?'amb':'ok']++});
  sum=`<div class="r" data-sf="red" role="button" tabindex="0" aria-pressed="${S.sf==='red'}"><b>${c.red}</b>scaduti</div><div class="a" data-sf="amb" role="button" tabindex="0" aria-pressed="${S.sf==='amb'}"><b>${c.amb}</b>entro 30 giorni</div><div class="o" data-sf="ok" role="button" tabindex="0" aria-pressed="${S.sf==='ok'}"><b>${c.ok}</b>in regola</div>`}
 else if(isSto){sum=`<div class="o" aria-pressed="true"><b>${items.filter(i=>i.done).length}</b>lavori eseguiti</div><div data-sn="lav" role="button" tabindex="0"><b>${items.filter(i=>!i.done).length}</b>da fare</div>`}else{const n=items.filter(i=>!i.done).length;sum=`<div aria-pressed="true"><b>${n}</b>da fare</div><div class="o" data-sn="sto" role="button" tabindex="0"><b>${items.length-n}</b>completati</div>`}
 $('sum').innerHTML=sum;
 $('f').style.display=isSto?'none':'';
 $('f').innerHTML=isScad
  ?`<input name="n" list="sg" placeholder="${sec.ph}" required aria-label="Nome"><datalist id="sg">${sec.sug.map(s=>`<option value="${esc(s)}">`).join('')}</datalist><input name="d" type="date" required aria-label="Data di scadenza"><button>Aggiungi scadenza</button>`
  :`<input name="n" placeholder="${sec.ph}" required aria-label="Lavoro"><input name="d" type="date" aria-label="Data prevista"><select name="c" aria-label="Categoria">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select name="p" aria-label="Priorità"><option value="0">Normale</option><option value="1">Urgente</option></select><button>Aggiungi lavoro</button>`;
 let rows=items.map((it,i)=>({it,i})).filter(r=>isScad?(!S.sf||S.sf==='all'||(S.sf==='red'?days(r.it.date)<0:S.sf==='amb'?days(r.it.date)>=0&&days(r.it.date)<=30:days(r.it.date)>30)):!!r.it.done===isSto);
 if(!isScad&&S.f!=='all')rows=rows.filter(r=>r.it.c===S.f);
 rows.sort(isScad?(a,b)=>a.it.date.localeCompare(b.it.date):isSto?(a,b)=>(b.it.doneDate||'').localeCompare(a.it.doneDate||''):(a,b)=>(b.it.p-a.it.p)||(a.it.date||'9').localeCompare(b.it.date||'9'));
 $('list').innerHTML=rows.length?rows.map(({it,i})=>{
  if(S.ed===i)return editRow(it,i);
  if(isScad){const d=days(it.date),c=d<0?'red':d<=30?'amb':'ok';
   const st=d<0?`Scaduto da ${-d} g`:d===0?'Scade oggi':`Tra ${d} g`;
   return `<li class="${c}"><span class="t" data-ed="${i}">${esc(it.n)}<small>${fmt(it.date)}</small></span>${S.ren===i?`<span class="st"><input type="date" id="rd" aria-label="Nuova scadenza"></span><button class="rn" data-ok="${i}">Salva</button>`:`<span class="st">${st}</span>${d<0?`<button class="rn" data-ren="${i}">Rinnova</button>`:''}`}<button data-del="${i}" aria-label="Elimina">✕</button></li>`}
  if(isSto)return `<li class="ok"><span class="t" data-ed="${i}">${esc(it.n)}<small>${CATS[it.c]||''}${it.date?', prevista '+fmt(it.date):''}</small></span><label class="st">Eseguito il <input type="date" data-dd="${i}" value="${it.doneDate||''}"></label><button data-del="${i}" aria-label="Elimina">✕</button></li>`;
  return `<li class="${it.p&&!it.done?'red':'ok'}${it.done?' done':''}"><input type="checkbox" data-chk="${i}" ${it.done?'checked':''} aria-label="Completato"><span class="t" data-ed="${i}">${esc(it.n)}<small>${CATS[it.c]||''}${it.date?', prevista '+fmt(it.date):''}</small></span>${it.date&&days(it.date)<0?'<span class="st" style="color:var(--red)">In ritardo</span>':''}${it.p?'<span class="st">Urgente</span>':''}<button data-del="${i}" aria-label="Elimina">✕</button></li>`}).join('')
  :`<li class="empty" style="display:block;border-left:1px dashed var(--line)">${isScad?(items.length?'Nessuna voce in questo stato.':'Nessuna scadenza. Aggiungine una qui sopra.'):isSto?'Nessun lavoro eseguito. Spunta un lavoro in Lavori da fare.':'Nessun lavoro. Aggiungine uno qui sopra.'}</li>`;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-sf],[data-sn],[data-ed],[data-s]')||e.target;
 if(t.dataset.s){S.sec=t.dataset.s;S.ren=null;S.sf='all';S.ed=null}
 else if(t.dataset.sf){S.sf=S.sf===t.dataset.sf?'all':t.dataset.sf;S.ren=null}
 else if(t.dataset.sn){S.sec=t.dataset.sn;S.sf='all';S.ed=null}
 else if(t.dataset.f){S.f=t.dataset.f}
 else if(t.dataset.ed!==undefined){S.ed=+t.dataset.ed;S.ren=null}
 else if(t.dataset.ec){S.ed=null}
 else if(t.dataset.es!==undefined){const li=t.closest('li'),g=n=>{const x=li.querySelector(`[name=${n}]`);return x?x.value:undefined},it=S.data[K()][+t.dataset.es],nm=g('n').trim();if(!nm||(SEC[S.sec].scad&&!g('date')))return;it.n=nm;it.date=g('date')||'';if(g('c')!==undefined)it.c=g('c');if(g('p')!==undefined)it.p=+g('p');if(g('doneDate')!==undefined)it.doneDate=g('doneDate');S.ed=null;save()}
 else if(t.dataset.ren!==undefined){S.ren=+t.dataset.ren}
 else if(t.dataset.ok!==undefined){const v=$('rd').value;if(!v)return;S.data[K()][+t.dataset.ok].date=v;S.ren=null;save()}
 else if(t.dataset.del!==undefined){S.data[K()].splice(+t.dataset.del,1);S.ren=null;S.ed=null;save()}
 else return;
 render();
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.chk!==undefined){const w=S.data[K()][+t.dataset.chk];w.done=t.checked;w.doneDate=t.checked?new Date().toLocaleDateString('sv-SE'):'';save();render()}
 if(t.dataset.dd!==undefined){S.data[K()][+t.dataset.dd].doneDate=t.value;save()}
});
$('f').addEventListener('submit',e=>{
 e.preventDefault();
 const f=new FormData($('f')),n=f.get('n').trim();
 if(!n)return;
 (S.data[S.sec]=S.data[S.sec]||[]).push(SEC[S.sec].scad?{n,date:f.get('d')}:{n,date:f.get('d')||'',c:f.get('c'),p:+f.get('p'),done:false});
 save();render();
});
$('exp').onclick=()=>{
 const a=document.createElement('a');
 a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S.data,null,1));
 a.download='barca-backup.json';a.click();
};
$('impb').onclick=()=>$('imp').click();
$('imp').onchange=e=>{
 const r=new FileReader();
 r.onload=()=>{try{S.data=JSON.parse(r.result)||{};save();render()}catch(x){alert('File non valido.')}};
 if(e.target.files[0])r.readAsText(e.target.files[0]);
};
render();
</script>
</body>
</html>
